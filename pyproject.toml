[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexcrawler"
version = "0.1.0"
description = "Crawl websites into clean, deduplicated markdown + images for RAG / chatbot knowledge bases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CortexCrawler" }]
keywords = ["crawler", "scraping", "markdown", "rag", "chatbot", "extraction"]

dependencies = [
    "httpx[http2]>=0.27",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "Pillow>=10.3",
    "imagehash>=4.3",
    "datasketch>=1.6",
    "PyYAML>=6.0",
    "python-slugify>=8.0",
    "tldextract>=5.1",
]

[project.optional-dependencies]
dynamic = ["playwright>=1.44"]              # JS-heavy / SPA sites (headless render)
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
cortex-crawl = "cortexcrawler.cli:crawl_cmd"

[project.urls]
Homepage = "https://github.com/Jignesh160/Context-Crawler-AI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
